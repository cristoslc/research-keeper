[project]
name = "research-keeper"
version = "1.0.0-alpha.6"
description = "Personal research library with auto-tagging and tiered synthesis"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "magic-wormhole>=0.14",
    "pyyaml>=6.0",
    "sentence-transformers>=5.3.0",
    "torch>=2.11.0",
    "tqdm>=4.67.3",
    "transformers>=5.5.0",
]

[project.optional-dependencies]
web = ["trafilatura>=2.0"]
media = ["yt-dlp", "faster-whisper>=1.0"]
documents = [
    "pymupdf>=1.24",
    "pymupdf4llm>=0.0.17",
]
mcp = ["mcp>=1.0"]
all = ["research-keeper[web,media,documents,mcp]"]
dev = ["pytest>=8.0", "pytest-tmp-files>=0.0.2"]

[project.scripts]
rk = "research_keeper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_keeper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
