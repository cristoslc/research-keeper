[project]
name = "research-keeper"
version = "0.5.0"
description = "Personal research library with auto-tagging and tiered synthesis"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
web = ["trafilatura>=2.0"]
media = ["yt-dlp", "faster-whisper>=1.0"]
documents = ["pymupdf>=1.24"]
mcp = ["mcp>=1.0"]
all = ["research-keeper[web,media,documents,mcp]"]
dev = ["pytest>=8.0", "pytest-tmp-files>=0.0.2"]

[project.scripts]
rk = "research_keeper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_keeper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
